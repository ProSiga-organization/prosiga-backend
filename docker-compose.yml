version: '3.8'
services:

  backend-tests:
    build: .
    container_name: backend-prosiga-tests
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    
    command: ["pytest", "--cov=app/periodo_letivo", "--cov-report=term-missing"]

  backend-api:
    build: .
    container_name: backend-prosiga-api
    ports:
      - "8000:8000"
    volumes:
      - .:/app

    depends_on:
      db:
        condition: service_healthy
      backend-tests:
        condition: service_completed_successfully
    
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: postgres:15
    container_name: postgres-prosiga
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: