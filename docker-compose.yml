version: '3.8'

networks:
  prosiga_net:
    external: true

volumes:
  postgres_data:

services:
  backend-api:
    build: .
    container_name: prosiga-backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_CONNECT_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    networks:
      - prosiga_net


  db:
    image: postgres:15
    container_name: postgres-prosiga
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - prosiga_net


  backend-tests:
    build: .
    container_name: backend-prosiga-tests
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    command: ["pytest", "--cov=app", "--cov-report=term-missing"]
    networks:
      - prosiga_net